<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DCRUSTM Attendance</title>
<meta name="description" content="Check your DCRUSTM attendance from dcrustm.samarth.edu.in. Enter your roll number and password to view class-wise attendance.">
<script src="./config.js"></script>
<script>
(function() {
  var t = localStorage.getItem('dcrustm_theme');
  if (t === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<style>
:root {
  --bg: #0b0c0e;
  --surface: #131519;
  --surface-2: #1a1d22;
  --border: #23262c;
  --border-strong: #34383f;
  --text: #d5d7dc;
  --text-dim: #868b94;
  --text-faint: #4f545c;
  --title: #ffffff;
  --ok: #6fae6f;
  --warn: #c99a4f;
  --bad: #c26060;
  --submit-bg: #ffffff;
  --submit-text: #0b0c0e;
  --submit-hover: #e2e4e9;
  --footer-bg: rgba(11, 12, 14, 0.95);
  --details-bg: #0d0f12;
  --shadow: rgba(0, 0, 0, 0.35);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
}

[data-theme="light"] {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --surface-2: #eef2f6;
  --border: #dce2ea;
  --border-strong: #b8c4d1;
  --text: #1a1f26;
  --text-dim: #555e6b;
  --text-faint: #8a94a2;
  --title: #111418;
  --ok: #1e8738;
  --warn: #b86e00;
  --bad: #cf3333;
  --submit-bg: #111418;
  --submit-text: #ffffff;
  --submit-hover: #2d333b;
  --footer-bg: rgba(245, 247, 250, 0.95);
  --details-bg: #f8fafc;
  --shadow: rgba(0, 0, 0, 0.08);
}
*, *::before, *::after { box-sizing: border-box; }
html {
  overflow-x: hidden !important;
  width: 100% !important;
  max-width: 100% !important;
  -webkit-text-size-adjust: 100%;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  margin: 0;
  padding: 0;
  overflow-x: hidden !important;
  width: 100% !important;
  max-width: 100% !important;
  touch-action: pan-y;
}
.wrap {
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
  padding: 48px 20px 120px;
  box-sizing: border-box;
}
@media (max-width: 520px) {
  .wrap { padding: 24px 12px 120px; }
}
header {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  margin-bottom: 12px;
  position: relative;
}
.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 8px;
}
.header-spacer {
  width: 36px;
  height: 36px;
  visibility: hidden;
  flex-shrink: 0;
}
.site-title {
  font-family: var(--sans);
  font-weight: 800;
  font-size: 32px;
  letter-spacing: -0.03em;
  color: var(--title);
  text-align: center;
  line-height: 1.25;
  margin: 0;
  flex: 1;
}
@media (max-width: 520px) {
  .site-title {
    font-size: 24px;
  }
}
.theme-toggle {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
  transition: all 0.2s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.theme-toggle:hover {
  color: var(--text);
  border-color: var(--border-strong);
  background: var(--surface-2);
}
.theme-icon {
  width: 18px;
  height: 18px;
}
:root .icon-sun { display: block; }
:root .icon-moon { display: none; }
[data-theme="light"] .icon-sun { display: none; }
[data-theme="light"] .icon-moon { display: block; }
.intro {
  color: var(--text-dim);
  max-width: 52ch;
  margin: 0 auto 28px auto;
  font-size: 14px;
  line-height: 1.6;
  text-align: center;
}
#form {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 22px;
  margin-bottom: 24px;
  box-shadow: 0 4px 20px var(--shadow);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
@media (max-width: 520px) {
  #form {
    padding: 16px;
    margin-bottom: 18px;
    border-radius: 6px;
  }
}
.form-inputs {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
@media (min-width: 520px) {
  .form-inputs {
    flex-direction: row;
    gap: 12px;
  }
}
.field {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.field-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 6px;
  display: block;
}
.form-input {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0 14px;
  height: 42px;
  font-size: 15px;
  font-family: inherit;
  border-radius: 4px;
  width: 100%;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.form-input:focus {
  border-color: var(--border-strong);
  background: var(--surface-2);
  outline: none;
}
.form-input::placeholder {
  color: #727782;
  opacity: 1;
}
.pw-wrap {
  position: relative;
  width: 100%;
}
.pw-wrap .form-input {
  padding-right: 48px;
}
.pw-toggle {
  position: absolute;
  right: 2px;
  top: 2px;
  bottom: 2px;
  width: 40px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
  border-radius: 3px;
  transition: color 0.15s ease, background 0.15s ease;
}
.pw-toggle:hover {
  color: var(--text);
  background: var(--surface-2);
}
.eye-icon {
  width: 18px;
  height: 18px;
  display: block;
}
.form-btn-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
}
.btn-forgot {
  background: var(--surface);
  color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 0 16px;
  height: 42px;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.btn-forgot:hover {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-strong);
}
button[type="submit"] {
  background: var(--submit-bg);
  color: var(--submit-text);
  border: 1px solid var(--border-strong);
  padding: 0 24px;
  height: 42px;
  border-radius: 4px;
  font-weight: 600;
  font-family: inherit;
  font-size: 15px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}
button[type="submit"]:hover:not(:disabled) {
  background: var(--submit-hover);
}
button[type="submit"]:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
@media (max-width: 520px) {
  .form-btn-row {
    flex-direction: column-reverse;
    gap: 10px;
  }
  .btn-forgot,
  button[type="submit"] {
    width: 100%;
  }
}
#err {
  color: var(--bad);
  background: rgba(194, 96, 96, 0.12);
  border: 1px solid rgba(194, 96, 96, 0.28);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 13px;
  margin-top: 14px;
  line-height: 1.5;
}
#err[hidden] {
  display: none;
}
#res {
  margin-top: 32px;
}
.summary {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 24px;
  width: 100%;
  box-sizing: border-box;
}
@media (max-width: 440px) {
  .summary {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .stat:last-child {
    grid-column: span 2;
  }
}
@media (min-width: 480px) and (max-width: 767px) {
  .summary {
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
}
@media (min-width: 768px) {
  .summary {
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 72px;
  box-sizing: border-box;
}
@media (max-width: 440px) {
  .stat {
    padding: 10px 12px;
    min-height: 64px;
  }
  .stat .value {
    font-size: 18px;
  }
}
.stat .label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  display: block;
  margin-bottom: 4px;
  font-weight: 500;
}
.stat .value {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
  display: block;
  white-space: nowrap;
}
.stat .sublabel {
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 3px;
  font-family: var(--mono);
}
.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  box-sizing: border-box;
}
table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
  box-sizing: border-box;
}
@media (min-width: 681px) {
  table {
    min-width: 600px;
  }
}
th {
  color: var(--text-dim);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  font-weight: 600;
  white-space: nowrap;
}
th.col-pct,
th.col-pal,
th.col-rem {
  text-align: center;
}
th.col-status {
  text-align: right;
}
td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tr:last-child td {
  border-bottom: none;
}
.col-course {
  width: 33%;
  min-width: 165px;
}
.col-pct {
  width: 11%;
  min-width: 60px;
}
.col-pal {
  width: 16%;
  min-width: 80px;
}
.col-rem {
  width: 12%;
  min-width: 65px;
}
.col-status {
  width: 28%;
  min-width: 155px;
}
.course-name {
  color: var(--text);
  font-weight: 500;
  line-height: 1.35;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  word-break: break-word;
}
.class-badge {
  display: inline-block;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 11px;
  padding: 1px 6px;
  font-weight: 500;
  white-space: nowrap;
}
.course-teacher {
  color: var(--text-faint);
  font-size: 11px;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pct-cell {
  font-family: var(--mono);
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
}
.pal-cell {
  font-family: var(--mono);
  color: var(--text-dim);
  text-align: center;
  white-space: nowrap;
  font-size: 12px;
}
.rem-cell {
  font-family: var(--mono);
  text-align: center;
  white-space: nowrap;
}
.rem-val {
  color: var(--text);
  font-weight: 600;
  font-size: 13px;
}
.rem-sub {
  display: block;
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 1px;
}
.cell-label {
  display: none;
}
.cell-val {
  display: inline;
}
.status-cell {
  text-align: right;
}
.status-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 3px;
  white-space: nowrap;
}
.status-pill.pill-ok {
  background: rgba(39, 174, 96, 0.12);
  color: var(--ok);
  border: 1px solid rgba(39, 174, 96, 0.25);
}
.status-pill.pill-warn {
  background: rgba(243, 156, 18, 0.12);
  color: var(--warn);
  border: 1px solid rgba(243, 156, 18, 0.25);
}
.status-pill.pill-bad {
  background: rgba(235, 87, 87, 0.12);
  color: var(--bad);
  border: 1px solid rgba(235, 87, 87, 0.25);
}
.status-pill.pill-critical {
  background: rgba(235, 87, 87, 0.22);
  color: #ff6b6b;
  border: 1px solid rgba(235, 87, 87, 0.4);
}
.status-pill.pill-none {
  background: var(--surface-2);
  color: var(--text-faint);
  border: 1px solid var(--border);
}
.status-sub {
  font-size: 10px;
  color: var(--text-dim);
  white-space: nowrap;
  font-family: var(--mono);
}
.course-row {
  cursor: pointer;
}
.course-row:hover td {
  background: var(--surface-2);
}
.course-row.is-open td {
  background: var(--surface-2);
  border-bottom-color: transparent;
}
.expand-caret {
  font-size: 11px;
  color: var(--text-dim);
  display: inline-block;
  margin-left: 4px;
}
.details-row td {
  padding: 0;
  background: var(--details-bg);
  border-bottom: 1px solid var(--border);
}
.details-row {
  display: table-row;
}
.details-row[hidden] {
  display: none !important;
}
.details-wrap {
  padding: 14px 16px 18px;
  border-top: 1px dashed var(--border);
  box-sizing: border-box;
  width: 100%;
}
.col-lbl {
  display: none;
}
.details-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.details-title-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.details-title {
  font-size: 12px;
  font-family: var(--mono);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text);
}
.details-teacher {
  font-size: 11px;
  color: var(--text-dim);
}
.details-stat {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--mono);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 3px;
}
.details-proj {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-dim);
  margin-bottom: 12px;
}
.details-proj strong {
  color: var(--text);
}
.filter-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.pill-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  font-size: 11px;
  font-family: var(--mono);
  padding: 4px 8px;
  cursor: pointer;
}
.pill-btn:hover {
  color: var(--text);
  border-color: var(--border-strong);
}
.pill-btn.active {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border-strong);
  font-weight: 600;
}
.records-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  max-height: 260px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 2px 4px 2px 0;
  scrollbar-gutter: stable;
  width: 100%;
  box-sizing: border-box;
}
@media (max-width: 768px) {
  .records-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
@media (max-width: 580px) {
  .records-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 6px;
    max-height: 280px;
  }
}
.record-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 4px;
  font-size: 12px;
  font-family: var(--mono);
  box-sizing: border-box;
  min-width: 0;
  width: 100%;
}
.record-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  width: 100%;
}
.record-date {
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.record-slot {
  color: var(--text-dim);
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.record-badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-present { color: var(--ok); }
.badge-absent { color: var(--bad); }
.badge-leave { color: var(--warn); }
.no-records {
  color: var(--text-dim);
  font-size: 12px;
  font-family: var(--mono);
  padding: 6px 0;
}
.res-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 14px;
  padding: 4px 2px 0;
}
.res-footer-actions {
  display: flex;
  gap: 16px;
}
.text-link {
  color: var(--text-dim);
  text-decoration: underline;
  cursor: pointer;
  background: none;
  border: none;
  font-size: 13px;
  font-family: inherit;
  padding: 0;
}
.text-link:hover {
  color: var(--text);
}

footer.fixed-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: var(--footer-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 4px;
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.5);
  box-sizing: border-box;
  width: 100%;
  overflow: hidden;
}

/* Mobile Smartphone Layout - Zero Horizontal Scrolling */
@media (max-width: 680px) {
  .table-wrap {
    overflow-x: hidden !important;
    border: none !important;
    background: transparent !important;
    border-radius: 0 !important;
  }
  table {
    display: block !important;
    width: 100% !important;
    min-width: 0 !important;
    border: none !important;
  }
  thead {
    display: none !important;
  }
  tbody {
    display: flex !important;
    flex-direction: column !important;
    gap: 10px !important;
    width: 100% !important;
  }
  .course-row {
    display: grid !important;
    grid-template-columns: 1fr auto !important;
    grid-template-areas:
      "course pct"
      "pal    rem"
      "status status" !important;
    gap: 8px 10px !important;
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-radius: 6px !important;
    padding: 12px 14px !important;
    box-sizing: border-box !important;
    width: 100% !important;
    min-width: 0 !important;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .course-row:active {
    background: var(--surface-2) !important;
  }
  .course-row.is-open {
    border-bottom-left-radius: 0 !important;
    border-bottom-right-radius: 0 !important;
    border-bottom-style: dashed !important;
    background: var(--surface-2) !important;
  }
  .col-course {
    grid-area: course !important;
    padding: 0 !important;
    border: none !important;
    width: auto !important;
    min-width: 0 !important;
  }
  .course-name {
    font-size: 14px !important;
    line-height: 1.35 !important;
    gap: 5px !important;
  }
  .pct-cell {
    grid-area: pct !important;
    padding: 0 !important;
    border: none !important;
    font-size: 18px !important;
    font-weight: 700 !important;
    text-align: right !important;
    align-self: start !important;
    white-space: nowrap !important;
    min-width: 0 !important;
    width: auto !important;
  }
  .pal-cell {
    grid-area: pal !important;
    padding: 0 !important;
    border: none !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 2px !important;
    min-width: 0 !important;
    width: auto !important;
  }
  .pal-cell .cell-label {
    display: block !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    color: var(--text-faint) !important;
    letter-spacing: 0.5px !important;
    font-family: var(--mono) !important;
    line-height: 1.2 !important;
  }
  .pal-cell .cell-val {
    display: block !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    color: var(--text) !important;
    font-family: var(--mono) !important;
    letter-spacing: 0.3px !important;
    line-height: 1.2 !important;
    white-space: nowrap !important;
  }
  .rem-cell {
    grid-area: rem !important;
    padding: 0 !important;
    border: none !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-end !important;
    gap: 2px !important;
    text-align: right !important;
    min-width: 0 !important;
    width: auto !important;
  }
  .rem-cell .cell-label {
    display: block !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    color: var(--text-faint) !important;
    letter-spacing: 0.5px !important;
    font-family: var(--mono) !important;
    text-align: right !important;
    line-height: 1.2 !important;
  }
  .rem-cell .cell-val {
    display: block !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    color: var(--text) !important;
    font-family: var(--mono) !important;
    text-align: right !important;
    line-height: 1.2 !important;
    white-space: nowrap !important;
  }
  .rem-sub {
    display: inline !important;
    margin-left: 3px !important;
    font-size: 11px !important;
    color: var(--text-dim) !important;
    font-weight: 400 !important;
  }
  .status-cell {
    grid-area: status !important;
    padding: 8px 0 0 0 !important;
    border: none !important;
    border-top: 1px solid rgba(255, 255, 255, 0.06) !important;
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    text-align: left !important;
    min-width: 0 !important;
    width: 100% !important;
  }
  .status-wrap {
    align-items: flex-start !important;
  }
  .col-lbl {
    display: inline !important;
    color: var(--text-faint);
    font-size: 11px;
    font-weight: 500;
    margin-right: 4px;
    font-family: var(--sans);
  }
  .details-row {
    display: block !important;
    width: 100% !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
    background: var(--surface) !important;
    border: 1px solid var(--border) !important;
    border-top: none !important;
    border-radius: 0 0 6px 6px !important;
    margin-top: -10px !important;
    margin-bottom: 10px !important;
  }
  .details-row[hidden] {
    display: none !important;
  }
  .details-row > td {
    display: block !important;
    padding: 0 !important;
    border: none !important;
    width: 100% !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
  }
  .details-wrap {
    padding: 12px 14px 16px !important;
    border-top: none !important;
    box-sizing: border-box !important;
    width: 100% !important;
  }
}
.footer-credit {
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 500;
  text-align: center;
}
.footer-link {
  color: var(--text);
  text-decoration: underline;
  text-underline-offset: 3px;
  font-weight: 600;
  transition: color 0.15s ease;
}
.footer-link:hover {
  color: #ff6b8b;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-bar">
      <div class="header-spacer" aria-hidden="true"></div>
      <h1 class="site-title">DCRUSTM attendance</h1>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle dark/light theme">
        <svg class="theme-icon icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="theme-icon icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
    </div>
  </header>

  <p class="intro">Reads attendance from dcrustm.samarth.edu.in. Enter your roll number and password to check your attendance.</p>

  <form id="form" novalidate>
    <div class="form-inputs">
      <div class="field">
        <label for="u" class="field-label">Roll number</label>
        <input class="form-input" type="text" id="u" name="username" placeholder="Roll number" autocomplete="username" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="p" class="field-label">Password</label>
        <div class="pw-wrap">
          <input class="form-input" type="password" id="p" name="password" placeholder="Password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" title="Toggle password visibility">
            <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-icon eye-off" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
              <line x1="2" x2="22" y1="2" y2="22"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="form-btn-row">
      <a href="https://dcrustm.samarth.edu.in/index.php/studentlogin/registration/reset-password" target="_blank" rel="noopener" class="btn-forgot">Forgot password</a>
      <button type="submit" id="go">Check attendance</button>
    </div>
  </form>

  <div id="err" hidden></div>
  <div id="res" hidden></div>

</div>
<footer class="fixed-footer">
  <div class="footer-credit">
    Made with &#128151;, by <a href="https://www.instagram.com/vishvjeetdahiyaa" target="_blank" rel="noopener" class="footer-link">Vishvjeet Dahiya</a>
  </div>
</footer>

<script>
(function () {
  'use strict';

  var cachedCreds = null;

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function pctColor(pct) {
    if (pct >= 85) return 'var(--ok)';
    if (pct >= 75) return 'var(--warn)';
    return 'var(--bad)';
  }

  function showErr(msg) {
    var el = document.getElementById('err');
    el.textContent = msg;
    el.hidden = false;
  }

  function clearErr() {
    var el = document.getElementById('err');
    el.textContent = '';
    el.hidden = true;
  }

  function setBtn(disabled, text) {
    var btn = document.getElementById('go');
    btn.disabled = disabled;
    btn.textContent = text;
  }

  function render(data) {
    var res = document.getElementById('res');
    var o = data.overall;

    var fetchedDate = new Date(data.fetchedAt);
    var fetchedLocal = fetchedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      + ', ' + fetchedDate.toLocaleDateString([], { month: 'short', day: 'numeric' });

    var rows = '';
    for (var i = 0; i < data.courses.length; i++) {
      var c = data.courses[i];
      var rem = typeof c.remaining === 'number' ? c.remaining : 0;
      var sched = typeof c.scheduled === 'number' ? c.scheduled : 0;
      var statusHtml;
      var projMsg = '';

      if (c.total === 0) {
        statusHtml = '<span class="status-pill pill-none">not marked yet</span>';
        if (sched > 0) {
          var initialSafe = Math.floor(0.25 * sched);
          projMsg = 'No classes held yet. <strong>' + sched + '</strong> total classes scheduled for semester. You can safely bunk up to <strong>' + initialSafe + '</strong> classes while keeping attendance &ge; 75%.';
        }
      } else if (c.pct >= 75) {
        var safeNow = Math.floor((c.present - 0.75 * c.total) / 0.75);
        var safeSem = Math.max(safeNow, Math.floor(c.present + 0.25 * rem - 0.75 * c.total));
        if (safeNow > 0) {
          statusHtml = '<span class="status-pill pill-ok">safe bunks ' + safeNow + '</span>';
        } else {
          statusHtml = '<span class="status-pill pill-warn">on edge 0 bunks</span>';
        }
        projMsg = 'Current attendance: <strong>' + c.pct.toFixed(2) + '%</strong>. You have <strong>' + rem + '</strong> remaining classes in the semester (can safely bunk up to <strong>' + safeSem + '</strong> in total while staying &ge; 75%).';
      } else {
        // Below 75%
        var rawNeed = Math.max(0, Math.ceil(3 * c.absent - c.present));
        if (rem > 0) {
          var maxPossiblePct = +((c.present + rem) / (c.total + rem) * 100).toFixed(1);
          if (rawNeed > rem) {
            // Cannot reach 75% even if attending all remaining classes!
            statusHtml = '<span class="status-pill pill-critical">attend ' + rem + ' classes</span>';
            projMsg = 'Attendance is below 75% (' + c.pct.toFixed(2) + '%). Even if you attend all <strong>' + rem + '</strong> remaining classes in the session, your final attendance will reach <strong style="color:var(--bad)">' + maxPossiblePct + '%</strong> (cannot reach 75%).';
          } else {
            // Can reach 75%
            statusHtml = '<span class="status-pill pill-bad">attend ' + rawNeed + ' classes</span>';
            projMsg = 'Attend <strong>' + rawNeed + '</strong> more classes to recover to 75.0%. If you attend all <strong>' + rem + '</strong> remaining classes, you will finish at <strong style="color:' + pctColor(maxPossiblePct) + '">' + maxPossiblePct + '%</strong>.';
          }
        } else {
          statusHtml = '<span class="status-pill pill-bad">attend ' + rawNeed + ' classes</span>';
          projMsg = 'Needs <strong>' + rawNeed + '</strong> more classes to reach 75%, but no more classes are scheduled.';
        }
      }

      var records = c.records || [];
      var recContent = '';
      if (records.length === 0) {
        recContent = '<div class="no-records">No attendance records have been marked on the portal yet for this class.</div>';
      } else {
        recContent = '<div class="records-grid" id="rec-grid-' + i + '">';
        for (var r = 0; r < records.length; r++) {
          var rec = records[r];
          var bClass = 'badge-' + (rec.status || '').toLowerCase();
          var timeShort = (rec.time || '--').replace(/:00\b/g, '');
          recContent += '<div class="record-card" data-status="' + esc(rec.status) + '">'
            + '<div class="record-header">'
            + '<span class="record-date">' + esc(rec.date) + '</span>'
            + '<span class="record-badge ' + bClass + '">' + esc(rec.status) + '</span>'
            + '</div>'
            + '<div class="record-slot">' + esc(timeShort) + '</div>'
            + '</div>';
        }
        recContent += '</div>';
      }

      var filterPills = '';
      if (records.length > 0) {
        filterPills = '<div class="filter-pills">'
          + '<button type="button" class="pill-btn active" data-filter="all" data-target="' + i + '">All (' + records.length + ')</button>'
          + '<button type="button" class="pill-btn" data-filter="Present" data-target="' + i + '">Present (' + c.present + ')</button>'
          + '<button type="button" class="pill-btn" data-filter="Absent" data-target="' + i + '">Absent (' + c.absent + ')</button>'
          + (c.leave > 0 ? '<button type="button" class="pill-btn" data-filter="Leave" data-target="' + i + '">Leave (' + c.leave + ')</button>' : '')
          + '</div>';
      }

      var detailsHtml = '<div class="details-wrap">'
        + '<div class="details-header">'
        + '<div class="details-title-row">'
        + '<span class="details-title">Class Log: ' + esc(c.code) + '</span>'
        + '<span class="details-teacher">Teacher: ' + esc(c.teacher || '--') + '</span>'
        + (sched > 0 ? '<span class="details-stat">' + rem + ' of ' + sched + ' classes left</span>' : '')
        + '</div>'
        + filterPills
        + '</div>'
        + (projMsg ? '<div class="details-proj">' + projMsg + '</div>' : '')
        + recContent
        + '</div>';

      rows += '<tr class="course-row" data-index="' + i + '">'
        + '<td class="col-course">'
        + '<div class="course-name">'
        + esc(c.name)
        + ' <span class="class-badge">' + esc(c.code) + '</span>'
        + ' <span class="expand-caret" id="caret-' + i + '">&#9662;</span>'
        + '</div>'
        + '<div class="course-teacher">' + esc(c.teacher || '--') + '</div>'
        + '</td>'
        + '<td class="pct-cell" style="color:' + (c.total === 0 ? 'var(--text-faint)' : pctColor(c.pct)) + '">' + (c.total === 0 ? '--' : esc(c.pct.toFixed(2)) + '%') + '</td>'
        + '<td class="pal-cell"><span class="cell-label">P / A / L</span><span class="cell-val">' + (c.total === 0 ? '--' : (c.present > 0 ? esc(c.present) : '--') + ' / ' + (c.absent > 0 ? esc(c.absent) : '--') + ' / ' + (c.leave > 0 ? esc(c.leave) : '--')) + '</span></td>'
        + '<td class="rem-cell"><span class="cell-label">Remaining</span><span class="cell-val">' + (sched > 0 ? ('<span class="rem-val">' + esc(rem) + '</span><span class="rem-sub">of ' + esc(sched) + '</span>') : '<span class="status-none">--</span>') + '</span></td>'
        + '<td class="status-cell">' + statusHtml + '</td>'
        + '</tr>'
        + '<tr class="details-row" id="details-' + i + '" hidden>'
        + '<td colspan="5">' + detailsHtml + '</td>'
        + '</tr>';
    }

    res.innerHTML = '<div class="summary">'
      + '<div class="stat"><span class="label">overall</span><span class="value" style="color:' + pctColor(o.pct) + '">' + esc(o.pct.toFixed(2)) + '%</span><span class="sublabel">' + (o.total || 0) + ' held</span></div>'
      + '<div class="stat"><span class="label">present</span><span class="value" style="color:var(--ok)">' + esc(o.present) + '</span><span class="sublabel">attended</span></div>'
      + '<div class="stat"><span class="label">absent</span><span class="value" style="color:var(--bad)">' + esc(o.absent) + '</span><span class="sublabel">missed</span></div>'
      + '<div class="stat"><span class="label">leave</span><span class="value" style="color:var(--text-dim)">' + esc(o.leave) + '</span><span class="sublabel">approved</span></div>'
      + '<div class="stat"><span class="label">remaining</span><span class="value" style="color:var(--text)">' + esc(o.remaining != null ? o.remaining : '--') + '</span><span class="sublabel">' + (o.scheduled ? o.scheduled + ' in sem' : 'classes left') + '</span></div>'
      + '</div>'
      + '<div class="table-wrap">'
      + '<table>'
      + '<thead><tr><th class="col-course">Course</th><th class="col-pct">%</th><th class="col-pal">P / A / L</th><th class="col-rem">Left</th><th class="col-status">Status</th></tr></thead>'
      + '<tbody>' + rows + '</tbody>'
      + '</table>'
      + '</div>'
      + '<div class="res-footer">'
      + '<span>Checked at ' + esc(fetchedLocal) + '</span>'
      + '<span class="res-footer-actions">'
      + '<button class="text-link" id="btn-refresh">refresh</button>'
      + '<button class="text-link" id="btn-clear">clear</button>'
      + '</span>'
      + '</div>';

    var courseRows = res.querySelectorAll('.course-row');
    for (var cr = 0; cr < courseRows.length; cr++) {
      courseRows[cr].addEventListener('click', function () {
        var idx = this.getAttribute('data-index');
        var dRow = document.getElementById('details-' + idx);
        var caret = document.getElementById('caret-' + idx);
        if (!dRow) return;
        var isHidden = dRow.hasAttribute('hidden');
        if (isHidden) {
          dRow.removeAttribute('hidden');
        } else {
          dRow.setAttribute('hidden', '');
        }
        this.classList.toggle('is-open', isHidden);
        if (caret) caret.innerHTML = isHidden ? '&#9652;' : '&#9662;';
      });
    }

    var pillBtns = res.querySelectorAll('.pill-btn');
    for (var pb = 0; pb < pillBtns.length; pb++) {
      pillBtns[pb].addEventListener('click', function (e) {
        e.stopPropagation();
        var targetIdx = this.getAttribute('data-target');
        var filter = this.getAttribute('data-filter');
        var parent = this.parentElement;
        var siblings = parent.querySelectorAll('.pill-btn');
        for (var s = 0; s < siblings.length; s++) siblings[s].classList.remove('active');
        this.classList.add('active');

        var grid = document.getElementById('rec-grid-' + targetIdx);
        if (!grid) return;
        var cards = grid.querySelectorAll('.record-card');
        for (var cd = 0; cd < cards.length; cd++) {
          var cStat = cards[cd].getAttribute('data-status');
          if (filter === 'all' || (cStat && cStat.toLowerCase() === filter.toLowerCase())) {
            cards[cd].style.display = 'flex';
          } else {
            cards[cd].style.display = 'none';
          }
        }
      });
    }

    document.getElementById('btn-refresh').addEventListener('click', function () {
      if (cachedCreds && cachedCreds.username && cachedCreds.password) {
        doFetch(cachedCreds.username, cachedCreds.password);
      } else {
        var pf = document.getElementById('p');
        if (pf) {
          pf.focus();
          showErr('enter your password above to refresh live');
        }
      }
    });
    document.getElementById('btn-clear').addEventListener('click', function () {
      res.innerHTML = '';
      res.hidden = true;
      cachedCreds = null;
      try {
        localStorage.removeItem('dcrustm_saved_attendance');
        localStorage.removeItem('dcrustm_saved_creds');
      } catch (_) {}
      var uf = document.getElementById('u');
      if (uf) uf.value = '';
      var pf = document.getElementById('p');
      if (pf) {
        pf.value = '';
        pf.type = 'password';
      }
      var tgl = document.getElementById('pw-toggle');
      if (tgl) {
        var openIcon = tgl.querySelector('.eye-open');
        var offIcon = tgl.querySelector('.eye-off');
        if (openIcon) openIcon.style.display = 'block';
        if (offIcon) offIcon.style.display = 'none';
        tgl.setAttribute('aria-label', 'Show password');
      }
      clearErr();
    });
  }

  function doFetch(username, password) {
    setBtn(true, 'Checking\u2026');
    clearErr();

    var workerUrl = window.DCRUSTM_WORKER;

    fetch(workerUrl + '/attendance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password }),
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.json().then(function (j) {
          throw new Error(j.error || 'request failed');
        }).catch(function (e) {
          if (e && e.message && e.message !== '[object Object]') throw e;
          throw new Error('request failed');
        });
      }
      return resp.json();
    }).then(function (data) {
      cachedCreds = { username: username, password: password };
      try {
        localStorage.setItem('dcrustm_saved_creds', JSON.stringify({ u: username, p: password }));
      } catch (_) {}
      render(data);
      document.getElementById('res').hidden = false;
      setBtn(false, 'Check attendance');
    }).catch(function (err) {
      var msg = (err && err.message) ? err.message : 'could not reach server';
      showErr(msg);
      setBtn(false, 'Check attendance');
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    var workerVal = window.DCRUSTM_WORKER;
    if (!workerVal || workerVal.indexOf('your-worker') !== -1) {
      showErr('config.js not edited. See README.');
      setBtn(true, 'Check attendance');
      return;
    }

    try {
      localStorage.removeItem('dcrustm_saved_attendance');
      var savedCredsRaw = localStorage.getItem('dcrustm_saved_creds');
      if (savedCredsRaw) {
        var creds = JSON.parse(savedCredsRaw);
        if (creds && creds.u && creds.p) {
          var uField = document.getElementById('u');
          var pField = document.getElementById('p');
          if (uField && !uField.value) uField.value = creds.u;
          if (pField && !pField.value) pField.value = creds.p;
        }
      }
    } catch (_) {}

    var themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', function () {
        var isLight = document.documentElement.getAttribute('data-theme') === 'light';
        var nextTheme = isLight ? 'dark' : 'light';
        if (nextTheme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        try {
          localStorage.setItem('dcrustm_theme', nextTheme);
        } catch (_) {}
      });
    }

    var pwToggle = document.getElementById('pw-toggle');
    var pwInput = document.getElementById('p');
    if (pwToggle && pwInput) {
      pwToggle.addEventListener('click', function () {
        var showing = pwInput.type === 'text';
        pwInput.type = showing ? 'password' : 'text';
        var openIcon = pwToggle.querySelector('.eye-open');
        var offIcon = pwToggle.querySelector('.eye-off');
        if (openIcon && offIcon) {
          openIcon.style.display = showing ? 'block' : 'none';
          offIcon.style.display = showing ? 'none' : 'block';
        }
        pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        pwInput.focus();
      });
    }

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var username = document.getElementById('u').value.trim();
      var password = document.getElementById('p').value;
      if (!username || !password) {
        showErr('enter roll number and password');
        return;
      }
      clearErr();
      doFetch(username, password);
    });
  });
}());
</script>
</body>
</html>
